<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="That page is not here.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23315c4d'/%3E%3Cpath d='M7 11l4 11 5-8 5 8 4-11' fill='none' stroke='%23f6f3ec' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <title>Not found — WeIndie</title>
  <style>
    :root{--paper:#f6f3ec;--ink:#20201d;--muted:#68675f;--line:#d8d3c8;--accent:#315c4d;--soft:#e5ede8}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column;min-height:100vh}
    a{color:inherit}
    .wrap{width:min(1120px,calc(100% - 40px));margin:auto}
    .nav{height:76px;display:flex;align-items:center;border-bottom:1px solid var(--line);flex:none}
    .brand{font-size:21px;font-weight:750;letter-spacing:-.04em;text-decoration:none}
    main{flex:1;display:flex;align-items:center;padding:72px 0}
    .eyebrow{color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:.14em;font-weight:750}
    h1{font-family:Georgia,serif;font-size:clamp(40px,6vw,64px);line-height:1;letter-spacing:-.05em;margin:16px 0 20px;font-weight:500}
    p{font-size:19px;color:var(--muted);max-width:520px;margin:0 0 28px}
    .home{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:10px 18px;text-decoration:none;color:var(--accent)}
    .home:hover{background:var(--soft);border-color:#aac0b6}
    footer{padding:28px 0 44px;color:var(--muted);font-size:13px;flex:none}
    .foot{border-top:1px solid var(--line);padding-top:24px}
  </style>
</head>
<body>
  <header class="wrap nav"><a class="brand" href="/">weindie</a></header>
  <main class="wrap">
    <div>
      <div class="eyebrow">Not found</div>
      <h1>That page isn’t here.</h1>
      <p>The link may be wrong, or the page may have been removed. Nothing else is broken.</p>
      <a class="home" href="/">Go to the homepage</a>
    </div>
  </main>
  <footer class="wrap"><div class="foot">weindie</div></footer>
</body>
</html>
