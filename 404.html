<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="That page is not here.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23315c4d'/%3E%3Cpath d='M8 22L14 10M18 22l6-12' fill='none' stroke='%23fbfaf7' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>Not found — WeIndie</title>
  <style>
    @font-face{font-family:"IBM Plex Mono";src:url(/fonts/ibm-plex-mono-400.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
    @font-face{font-family:"IBM Plex Mono";src:url(/fonts/ibm-plex-mono-500.woff2) format("woff2");font-weight:500;font-style:normal;font-display:swap}
    @font-face{font-family:"Newsreader";src:url(/fonts/newsreader-var.woff2) format("woff2");font-weight:400 600;font-style:normal;font-display:swap}
    :root{
      --paper:#fbfaf7;--rule:#d9d7ce;--ink:#16181a;--muted:#54574f;--faint:#6b6e66;--accent:#315c4d;
      --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      --serif:"Newsreader",Georgia,"Times New Roman",serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.55;display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
    .wrap{width:min(1080px,calc(100% - 44px));margin:0 auto}
    .nav{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:22px 0 12px;border-bottom:2px solid var(--ink);flex:none}
    .nav a{color:var(--ink);text-decoration:none;font-weight:500}
    main{flex:1;display:flex;align-items:center;padding:64px 0}
    .code{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
    h1{font-family:var(--serif);font-size:clamp(34px,5.4vw,58px);line-height:1.06;letter-spacing:-.025em;margin:18px 0 18px;font-weight:500;max-width:12em}
    p{color:var(--muted);max-width:34em;margin:0 0 28px}
    .home{font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;border:1px solid var(--ink);padding:9px 15px;text-decoration:none;color:var(--ink);display:inline-block}
    .home:hover{background:var(--ink);color:var(--paper)}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    footer{border-top:2px solid var(--ink);padding:20px 0 48px;flex:none}
    .foot{font-family:var(--mono);font-size:12px;color:var(--faint);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px 24px}
    .foot b{color:var(--ink);font-weight:500;letter-spacing:.08em;text-transform:uppercase}
    .foot a{color:var(--faint)}
  </style>
</head>
<body>
  <header class="wrap nav"><a href="/">weindie</a><span>404</span></header>
  <main class="wrap">
    <div>
      <div class="code">Not found</div>
      <h1>That page isn&rsquo;t here.</h1>
      <p>The link may be wrong, or the page may have been removed. Nothing else is broken.</p>
      <a class="home" href="/">Go to the homepage</a>
    </div>
  </main>
  <footer class="wrap"><div class="foot"><b>weindie</b><span>Independent tools for navigating work with AI.</span><span><a href="/LICENSE.txt">MIT licensed</a></span></div></footer>
</body>
</html>
